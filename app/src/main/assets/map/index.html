<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Market locations</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <style>
    :root {
      --seed: #1B5E20;
      --seed-dark: #0D3B12;
      --harvest: #F9A825;
      --surface: #FAFDF8;
      --soil: #5D4037;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--surface);
      color: #1A1C19;
    }
    #map { width: 100%; height: 100%; }
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }
    .leaflet-popup-content {
      margin: 12px 14px;
      min-width: 160px;
    }
    .popup-title {
      font-weight: 700;
      color: var(--seed-dark);
      font-size: 15px;
      margin: 0 0 4px;
    }
    .popup-region {
      color: var(--soil);
      font-size: 13px;
      margin: 0 0 6px;
    }
    .popup-crops {
      font-size: 12px;
      line-height: 1.35;
      margin: 0;
    }
    .legend {
      position: absolute;
      z-index: 1000;
      left: 12px;
      bottom: 24px;
      background: rgba(250, 253, 248, 0.95);
      border: 1px solid #C4C8C0;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      max-width: 200px;
    }
    .legend strong { display: block; color: var(--seed-dark); margin-bottom: 4px; }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--seed);
      border: 2px solid var(--harvest);
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Tanzania market map"></div>
  <div class="legend">
    <strong>Masoko / Markets</strong>
    <span class="legend-dot"></span> Agricultural market
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="markets.js"></script>
  <script>
    (function () {
      var map = L.map('map', {
        zoomControl: true,
        attributionControl: true
      }).setView([-6.2, 35.0], 6);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      var markerIcon = L.divIcon({
        className: '',
        html: '<div style="width:16px;height:16px;border-radius:50%;background:#1B5E20;border:3px solid #F9A825;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        popupAnchor: [0, -10]
      });

      var bounds = [];
      MARKET_LOCATIONS.forEach(function (market) {
        var latlng = [market.lat, market.lng];
        bounds.push(latlng);
        L.marker(latlng, { icon: markerIcon })
          .addTo(map)
          .bindPopup(
            '<p class="popup-title">' + market.name + '</p>' +
            '<p class="popup-region">' + market.region + '</p>' +
            '<p class="popup-crops"><strong>Crops:</strong> ' + market.crops + '</p>'
          );
      });

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [36, 36], maxZoom: 7 });
      }
    })();
  </script>
</body>
</html>
